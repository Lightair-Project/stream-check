<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Check</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e6e8ee;--dim:#8b93a3;--accent:#4f9dff;--ok:#38c172;--warn:#f0b429;--bad:#ef5350;--live:#ef5350;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--panel:#fff;--panel2:#f0f2f6;--line:#d9dde6;--text:#1a1d24;--dim:#667085;--accent:#1f6fe0;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;margin:0;font-weight:650}
header .sp{flex:1}
button{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
main{padding:16px 20px;display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.connect{padding:12px 16px;display:none}
.connect.open{display:block}
.connect .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.connect .body{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.connect img{width:150px;height:150px;border-radius:6px;background:#fff}
.urls{flex:1;min-width:280px;display:grid;gap:6px}
.url{display:flex;gap:8px;align-items:center}
.url b{width:60px;color:var(--dim);font-weight:500}
.url code{flex:1;word-break:break-all;background:var(--panel2);padding:3px 6px;border-radius:4px;font-size:12.5px}
.empty{padding:40px;text-align:center;color:var(--dim)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(520px,1fr))}
.card{overflow:hidden}
.card.ended{opacity:.85}
.ch{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.badge{font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;text-transform:uppercase}
.pill.live{background:var(--live);color:#fff}
.pill.grace{background:var(--warn);color:#000}
.pill.ended{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.key{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.dim{color:var(--dim)}
.pv{position:relative;background:#000;aspect-ratio:16/9;max-height:380px;width:100%;display:flex;align-items:center;justify-content:center}
.pv canvas,.pv img{width:100%;height:100%;object-fit:contain;display:block}
.pv .msg{position:absolute;color:#9aa;font-size:13px;text-align:center;padding:10px}
.pv .tools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;padding:8px 14px;align-items:center;font-size:12px}
.bar{height:8px;background:var(--panel2);border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ok) 0 70%,var(--warn) 70% 92%,var(--bad) 92%);width:0;transition:width .15s}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--panel);padding:6px 12px}
.stat label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.stat span{font-variant-numeric:tabular-nums;font-size:13.5px}
.stat.bad span{color:var(--bad)}.stat.warn span{color:var(--warn)}
.viol{padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--bad);color:var(--bad)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.cleared{border-color:var(--line);color:var(--dim);text-decoration:line-through}
.graphs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px}
.graphs div{background:var(--panel2);border-radius:6px;padding:4px 6px}
.graphs label{font-size:10.5px;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between}
.graphs canvas{width:100%;height:46px;display:block}
.faults{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;align-items:center;border-top:1px solid var(--line)}
.faults .now{font-size:12px;color:var(--warn)}
.tracks{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;padding:8px 14px;border-top:1px solid var(--line)}
.tracks .th{flex:1 0 100%;font-size:12px;color:var(--dim)}
.tracks figure{margin:0;max-width:100%}
.tracks .tpv{position:relative;display:inline-block;min-width:160px;min-height:90px;background:#000;border-radius:6px;overflow:hidden;vertical-align:top}
.tracks canvas{display:block;max-width:100%;max-height:300px;width:auto;height:auto}
.tracks .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#ccc;padding:8px;text-align:center}
.tracks figcaption{font-size:11px;color:var(--dim);margin-top:4px;max-width:420px}
.tracks figcaption.bad{color:var(--bad, #e5534b)}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-top:1px solid var(--line)}
.thumbs figure{margin:0;flex:0 0 auto;text-align:center}
.thumbs img{height:54px;border-radius:4px;display:block;background:#000}
.thumbs figcaption{font-size:10px;color:var(--dim)}
.log{max-height:170px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;padding:8px 14px;border-top:1px solid var(--line)}
.log div{white-space:pre-wrap}
.log .warn{color:var(--warn)}.log .error{color:var(--bad)}.log .t{color:var(--dim)}
.links{padding:6px 14px 10px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
a{color:var(--accent)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:8px 0 0}
.rej{padding:8px 14px;font-size:12.5px}
.card.k-pull{border-left:3px solid var(--accent)}
.card.k-file{border-left:3px solid #a879f0}
.badge.kind{border-color:transparent;color:#fff;background:var(--accent)}
.badge.kind.file{background:#a879f0}
.src{padding:6px 14px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line);display:flex;gap:4px 14px;flex-wrap:wrap}
.src b{color:var(--text);font-weight:500}
.chip.info{border-color:var(--line);color:var(--dim)}
.cc{padding:4px 14px 6px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--text);border-top:1px solid var(--line)}
.cc:before{content:"CC ";color:var(--dim)}
.rej div{padding:2px 0}
</style>
</head>
<body>
<header>
  <h1>Stream Check</h1>
  <span class="dim" id="sub">connecting…</span>
  <span class="sp"></span>
  <button id="btn-connect">Connect a sender</button>
  <button id="btn-faultall" title="Faults for every stream">Faults for all…</button>
</header>
<main>
  <section class="panel connect" id="connect"></section>
  <section id="live"></section>
  <section id="earlier"></section>
  <section id="rejections"></section>
</main>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } for (const k of kids) e.append(k); return e; };
const fmt = (n, d = 1) => (n == null || !isFinite(n)) ? "–" : Number(n).toFixed(d);
const dur = s => { s = Math.round(s || 0); const m = Math.floor(s / 60); return m ? `${m}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`; };
const cards = new Map();
let state = null, hostIndex = 0, protoTab = "rtmp", platformTab = "open";
let audioCtx = null, unmuted = null; // the card whose sound plays

/* ---------- state socket ---------- */
function connectState() {
  const ws = new WebSocket(`ws://${location.host}/ws/state`);
  ws.onmessage = e => { state = JSON.parse(e.data); render(); };
  ws.onclose = () => { $("#sub").textContent = "disconnected; retrying…"; setTimeout(connectState, 1500); };
}

function render() {
  const live = state.sessions.filter(s => s.state !== "ended");
  const ended = state.sessions.filter(s => s.state === "ended");
  $("#sub").textContent = `up ${dur(state.uptime_s)} · ${live.length} live · ${ended.length} ended`;
  renderConnect();
  const seen = new Set();
  for (const s of state.sessions) { seen.add(s.id); let c = cards.get(s.id); if (!c) { c = makeCard(s); cards.set(s.id, c); } c.update(s); }
  for (const [id, c] of cards) if (!seen.has(id)) { c.destroy(); cards.delete(id); }
  fill($("#live"), "Live", live, "No stream yet. Point a sender at one of the addresses under “Connect a sender”.");
  fill($("#earlier"), "Earlier sessions", ended, null);
  const rej = state.rejections || [];
  const box = $("#rejections");
  box.replaceChildren();
  if (rej.length) {
    box.append(el("h2", {}, "Refused connections"));
    const p = el("div", { class: "panel rej" });
    for (const r of rej.slice(0, 8)) p.append(el("div", {}, `${new Date(r.wall_ms).toLocaleTimeString()} · ${r.proto.toUpperCase()} · ${r.platform}/${r.key || "(no key)"} from ${r.remote}: ${r.msg}`));
    box.append(p);
  }
}

function fill(root, title, list, emptyMsg) {
  let grid = root.querySelector(".grid");
  if (!list.length) { root.replaceChildren(emptyMsg ? el("div", { class: "panel empty" }, emptyMsg) : ""); return; }
  if (!grid) { root.replaceChildren(el("h2", {}, title), grid = el("div", { class: "grid" })); }
  const want = list.map(s => cards.get(s.id).root);
  if (grid.children.length !== want.length || want.some((n, i) => grid.children[i] !== n)) grid.replaceChildren(...want);
}

/* ---------- connect panel ---------- */
let lastConnectKey = "";
function renderConnect() {
  const a = state.addresses; if (!a || !a.hosts) return;
  const h = a.hosts[Math.min(hostIndex, a.hosts.length - 1)];
  const st = h.streams.find(s => s.platform === platformTab) || h.streams[0];
  const urlFor = { rtmp: st.rtmp && st.rtmp.url, rtmps: st.rtmps && st.rtmps.url, srt: st.srt, whip: st.whip }[protoTab] || st.rtmp.url;
  const k = [hostIndex, protoTab, platformTab, urlFor, a.srt_passphrase, a.whip_token].join("|");
  if (k === lastConnectKey) return; lastConnectKey = k;
  const box = $("#connect"); box.replaceChildren();
  const hostRow = el("div", { class: "row" }, el("span", { class: "dim" }, "From: "));
  a.hosts.forEach((x, i) => hostRow.append(el("button", { class: i === hostIndex ? "on" : "", onclick: () => { hostIndex = i; lastConnectKey = ""; renderConnect(); } }, `${x.label} (${x.host})`)));
  const platRow = el("div", { class: "row" }, el("span", { class: "dim" }, "Platform: "));
  for (const p of h.streams) platRow.append(el("button", { class: p.platform === platformTab ? "on" : "", onclick: () => { platformTab = p.platform; lastConnectKey = ""; renderConnect(); } }, p.platform));
  const protoRow = el("div", { class: "row" }, el("span", { class: "dim" }, "Protocol: "));
  for (const p of ["rtmp", "rtmps", "srt", "whip"]) if (p !== "rtmps" || st.rtmps) protoRow.append(el("button", { class: p === protoTab ? "on" : "", onclick: () => { protoTab = p; lastConnectKey = ""; renderConnect(); } }, p.toUpperCase()));
  const urls = el("div", { class: "urls" });
  const line = (label, value) => urls.append(el("div", { class: "url" }, el("b", {}, label), el("code", {}, value), el("button", { onclick: e => { navigator.clipboard && navigator.clipboard.writeText(value); e.target.textContent = "copied"; setTimeout(() => e.target.textContent = "copy", 900); } }, "copy")));
  if (protoTab === "rtmp" || protoTab === "rtmps") { const r = st[protoTab]; line("Server", r.server); line("Key", r.key); line("Full URL", r.url); if (protoTab === "rtmps") urls.append(el("div", { class: "dim" }, "Self-signed certificate: the sender has to be told to accept it (in the data folder: tls/cert.pem)."));
  } else if (protoTab === "srt") { line("URL", st.srt); if (!a.srt_passphrase) urls.append(el("div", { class: "dim" }, "No passphrase required. Start with --srt-passphrase to require one.")); }
  else { line("Endpoint", st.whip); line("Bearer", a.whip_token || "(none required)"); }
  urls.append(el("div", { class: "dim" }, `Key rule for ${st.platform}: ${st.platform === "open" ? "anything" : "must look like " + st.key}. Android emulator: use the “android-emulator” host.`));
  box.append(hostRow, platRow, protoRow, el("div", { class: "body" }, el("img", { alt: "QR code", src: `/api/qr?text=${encodeURIComponent(urlFor)}` }), urls));
}
$("#btn-connect").onclick = () => $("#connect").classList.toggle("open");
$("#btn-faultall").onclick = () => { const w = prompt("Fault for every stream: drop, refuse 10, freeze 10, throttle 500, latency 300, loss 5, clear", "refuse 10"); if (w) sendFault("*", w); };

async function sendFault(target, text) {
  const [what, n] = text.trim().split(/\s+/); const v = parseFloat(n);
  const body = { drop: { drop: true }, refuse: { refuse_s: v }, freeze: { freeze_s: v }, throttle: { throttle_kbps: v }, latency: { latency_ms: v }, loss: { loss_pct: v }, clear: { clear: true } }[what];
  if (!body) return alert("Unknown fault " + what);
  await fetch(`/api/faults/${encodeURIComponent(target)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}

/* ---------- codecs ---------- */
// The codec's name from its WebCodecs codec string.
function codecName(codec, hevc) {
  const c = (codec || "").slice(0, 4);
  return { avc1: "H.264", avc3: "H.264", hvc1: "HEVC", hev1: "HEVC", av01: "AV1", vp09: "VP9", vp8: "VP8" }[c] || (hevc ? "HEVC" : codec || "this codec");
}
// A decoder configuration: H.264, HEVC and AV1 take their codec record as the description; VP8 and VP9 take none.
function decoderConfig(codec, desc, w, h) {
  const cfg = { codec, codedWidth: w || undefined, codedHeight: h || undefined, optimizeForLatency: true };
  if (desc && desc.length && !/^vp(8|09)/.test(codec)) cfg.description = desc;
  return cfg;
}
const KIND_LABEL = { file: "file check", rtsp: "RTSP pull", ndi: "NDI", camera: "camera" };

/* ---------- a stream card ---------- */
function makeCard(s0) {
  const root = el("div", { class: "panel card" });
  const stat = (k, label) => el("div", { class: "stat", "data-k": k }, el("label", {}, label), el("span", {}));
  const head = el("div", { class: "ch" });
  const canvas = el("canvas", { width: 640, height: 360 });
  const still = el("img", { alt: "", style: "display:none" });
  const msg = el("div", { class: "msg" }, "waiting for the first picture…");
  const muteBtn = el("button", {}, "🔇 Unmute");
  const tools = el("div", { class: "tools" }, muteBtn);
  const pv = el("div", { class: "pv" }, canvas, still, msg, tools);
  const meters = el("div", { class: "meters" });
  const meterRow = (n) => { const bar = el("div", { class: "bar" }, el("i")); const val = el("span", { class: "dim" }, "–"); meters.append(el("span", { class: "dim" }, n), bar, val); return { bar: bar.firstChild, val }; };
  const mL = meterRow("L"), mR = meterRow("R");
  const lufs = el("div", { class: "dim", style: "grid-column:1/-1" }, "");
  meters.append(lufs);
  const stats = el("div", { class: "stats" },
    stat("video", "Video"), stat("res", "Resolution"), stat("fps", "Frame rate"), stat("vbr", "Video bitrate"), stat("key", "Keyframe interval"), stat("gop", "GOP"),
    stat("ts", "Timestamps"), stat("stall", "Stalls"), stat("av", "A/V offset"), stat("drift", "A/V drift"),
    stat("audio", "Audio"), stat("loud", "Loudness (M / S / I)"), stat("sil", "Silence"), stat("rtp", "RTP (lost / repaired / late)"),
    stat("colour", "Colour"), stat("bits", "Bitstream"), stat("bpm", "Performance metrics (BPM)"), stat("lat", "Latency (sender clock)"), stat("cc", "Captions"), stat("enc", "Encoder (user data)"),
    stat("srtloss", "SRT loss (missing / recovered / dropped)"), stat("srtlat", "SRT latency · round trip"), stat("srtrx", "SRT receive"), stat("srtlink", "SRT link"),
    stat("sess", "Session"));
  const viol = el("div", { class: "viol" });
  const gcan = ["Bitrate kbps", "Frames per second", "Audio level dB", "SRT loss % · drops", "SRT receive kbps", "Latency ms (sender clock)"].map(l => { const c = el("canvas", { width: 300, height: 46 }); const v = el("span", {}, ""); return { c, v, wrap: el("div", {}, el("label", {}, l, v), c) }; });
  const graphs = el("div", { class: "graphs" }, ...gcan.map(g => g.wrap));
  const faults = el("div", { class: "faults" });
  const faultNow = el("span", { class: "now" });
  const mk = (label, text, cls = "") => el("button", { class: cls, onclick: () => sendFault(s0.key, text) }, label);
  faults.append(mk("Drop", "drop", "danger"), mk("Refuse 10 s", "refuse 10", "danger"), mk("Freeze 10 s", "freeze 10"), mk("Throttle 500 kbps", "throttle 500"), mk("Latency 300 ms", "latency 300"), mk("Loss 5 %", "loss 5"), mk("Clear", "clear"), faultNow);
  const thumbs = el("div", { class: "thumbs" });
  const log = el("div", { class: "log" });
  const links = el("div", { class: "links" });
  // Enhanced RTMP multitrack (Twitch Dual Format): each track beyond the first, its own picture
  const tracksHead = el("div", { class: "th" });
  const tracksEl = el("div", { class: "tracks", style: "display:none" }, tracksHead);
  const src = el("div", { class: "src", style: "display:none" });
  const ccLine = el("div", { class: "cc", style: "display:none" });
  root.append(head, src, pv, tracksEl, meters, stats, ccLine, viol, graphs, faults, thumbs, log, links);
  const trackViews = new Map();
  function trackView(t) {
    const c = el("canvas", { width: 360, height: 640 });
    const m = el("div", { class: "msg" }, "waiting for the first picture…");
    const cap = el("figcaption", {}, `track ${t}`);
    const fig = el("figure", {}, el("div", { class: "tpv" }, c, m), cap);
    const g = c.getContext("2d");
    let tws = null, dec = null, key = false, last = null, gone = false;
    const say = x => { m.textContent = x; m.style.display = x ? "" : "none"; };
    async function setup(u8) {
      last = u8;
      const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
      const n = u8[2], codec = new TextDecoder().decode(u8.slice(3, 3 + n));
      const w = dv.getUint16(3 + n), h = dv.getUint16(5 + n), desc = u8.slice(7 + n);
      const cfg = decoderConfig(codec, desc, w, h);
      let ok = false; try { ok = (await VideoDecoder.isConfigSupported(cfg)).supported; } catch { }
      if (!ok) { say(`This browser can't decode ${codecName(codec)} (${codec}); the track's recording is in the links below.`); dec = null; return; }
      if (dec && dec.state !== "closed") dec.close();
      const mine = new VideoDecoder({
        output: f => { if (c.width !== f.displayWidth) { c.width = f.displayWidth; c.height = f.displayHeight; } g.drawImage(f, 0, 0); f.close(); say(""); },
        error: e => { say("decoder: " + e.message); if (dec === mine && last && !gone) { dec = null; setTimeout(() => setup(last), 200); } }
      });
      dec = mine; mine.configure(cfg); key = false;
    }
    async function onMsg(dv, u8) {
      if (u8[0] === 1) await setup(u8);
      else if (u8[0] === 2 && dec && dec.state === "configured") {
        const k = u8[1] === 1; if (!key && !k) return; key = true;
        if (dec.decodeQueueSize > 120) { key = false; return; }
        dec.decode(new EncodedVideoChunk({ type: k ? "key" : "delta", timestamp: Number(dv.getBigInt64(2)), data: u8.subarray(10) }));
      }
    }
    function open() {
      if (!("VideoDecoder" in window)) { say("This browser can't decode video (WebCodecs)."); return; }
      tws = new WebSocket(`ws://${location.host}/ws/preview/${encodeURIComponent(s0.id)}?track=${t}`);
      tws.binaryType = "arraybuffer";
      tws.onmessage = e => onMsg(new DataView(e.data), new Uint8Array(e.data));
      tws.onclose = () => { if (!gone && cardState.state !== "ended") setTimeout(open, 1500); };
    }
    setTimeout(open, 50);
    return { fig, cap, close() { gone = true; if (tws) tws.close(); if (dec && dec.state !== "closed") dec.close(); } };
  }
  function updateTracks(s) {
    const tr = (s.tracks && s.tracks.tracks) || [];
    tracksEl.style.display = tr.length ? "" : "none";
    if (!tr.length) return;
    const kq = s.client && s.client.key_query, er = s.client && s.client.enhanced_rtmp;
    tracksHead.textContent = `${s.tracks.count} tracks (track 0 is the picture above) · ${fmt(s.tracks.total_video_kbps, 0)} kbps of picture in all`
      + (kq ? ` · key query: ${kq.client_config_id ? "clientConfigId is there" : "no clientConfigId"}` : "")
      + (er ? ` · Enhanced RTMP caps ${er.caps_ex}${er.multitrack ? " (multitrack)" : ""}` : "");
    for (const t of tr) {
      if (!t.has_video) continue;
      if (!trackViews.has(t.track)) { const v = trackView(t.track); trackViews.set(t.track, v); tracksEl.append(v.fig); }
      const tv = t.video || {}, sp = tv.sps, cap = trackViews.get(t.track).cap;

    spark(gcan[1].c, ser.map(p => p.fps), "#38c172"); gcan[1].v.textContent = fmt(v.fps_arrival);
    spark(gcan[2].c, ser.map(p => p.peak_db), "#f0b429", -60, 0); gcan[2].v.textContent = lv.peak_l_db != null ? fmt(Math.max(lv.peak_l_db, lv.peak_r_db ?? -120)) : "–";
    const f = s.faults, act = [];
    if (f.refuse_left_s) act.push(`refusing ${fmt(f.refuse_left_s, 0)} s`); if (f.freeze_left_s) act.push(`frozen ${fmt(f.freeze_left_s, 0)} s`);
    if (f.throttle_kbps) act.push(`throttle ${f.throttle_kbps} kbps`); if (f.latency_ms) act.push(`+${f.latency_ms} ms`); if (f.loss_pct) act.push(`${f.loss_pct}% loss`);
    faultNow.textContent = act.length ? "active: " + act.join(", ") : "";
    faults.style.display = s.state === "ended" ? "none" : "";
    if (thumbN !== s.thumbs.length) { thumbN = s.thumbs.length; thumbs.replaceChildren(...s.thumbs.map(t => el("figure", {}, el("img", { loading: "lazy", src: `/media/${encodeURIComponent(s.id)}/thumbs/${t.file}` }), el("figcaption", {}, dur(t.t))))); thumbs.scrollLeft = thumbs.scrollWidth; }
    thumbs.style.display = s.thumbs.length ? "" : "none";
    if (logN !== s.events_total || s.state !== headKey) {
      logN = s.events_total; headKey = s.state;
      const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
      log.replaceChildren(...s.events.map(e => el("div", { class: e.level }, el("span", { class: "t" }, `${fmt(e.t)}s `), `${e.kind}: ${e.msg}`)));
      if (atEnd) log.scrollTop = log.scrollHeight;
    }
    const idq = encodeURIComponent(s.id);
    links.replaceChildren(el("a", { href: `/api/sessions/${idq}/report`, target: "_blank" }, "report (JSON)"), el("a", { href: `/api/sessions/${idq}`, target: "_blank" }, "live stats (JSON)"), el("a", { href: `/api/sessions/${idq}/events`, target: "_blank" }, "events (JSON)"),
      ...s.segments.map(g => el("a", { href: `/media/${idq}/${g.file}`, download: g.file }, `${g.file} (${(g.bytes / 1e6).toFixed(1)} MB${g.probe ? ", plays" : ""})`)), el("span", { class: "dim" }, s.id));
  }
  return { root, update, destroy() { destroyed = true; if (ws) ws.close(); if (vdec && vdec.state !== "closed") vdec.close(); api.stop(); for (const v of trackViews.values()) v.close(); } };
}

connectState();
