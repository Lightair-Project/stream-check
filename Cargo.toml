[package]
name = "stream-check"
description = "A local fake streaming platform for testing RTMP, RTMPS, SRT and WHIP senders (OBS, ffmpeg, mobile apps): web UI with live preview and stats, fault injection, recordings, JSON API and CLI."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lightair-Project/stream-check"
readme = "README.md"
keywords = ["rtmp", "srt", "whip", "streaming", "testing"]
categories = ["development-tools::testing", "multimedia::video"]

[lib]
name = "stream_check"
path = "src/lib.rs"

[[bin]]
name = "stream-check"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "process", "fs", "signal"] }
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RTMPS: rustls with ring (no aws-lc), a self-signed certificate made at first start
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# SRT listener (Apache-2.0), as camera-desk uses it
srt-tokio = "0.4.4"
srt-protocol = "0.4.4"
# WHIP: WebRTC in Rust, as the engine's sender
webrtc = "0.21.1"
rtc = { version = "0.21.1", default-features = false }
async-trait = "0.1"
# loudness (EBU R128)
ebur128 = "0.1"
# QR codes for the addresses
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# the CLI talks to a running lab
ureq = "3"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "debuginfo"

[workspace]
